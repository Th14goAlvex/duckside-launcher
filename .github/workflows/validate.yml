name: Validar projeto

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: Sintaxe e dependências
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v7
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar Electron e interface
        run: npm run check
      - name: Validar API
        run: node --check backend/server.mjs
